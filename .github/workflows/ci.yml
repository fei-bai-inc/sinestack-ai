name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-version:
    name: Release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate changed package versions
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release-version.mjs "$BASE_SHA"
      - name: Prevent a skipped check from satisfying main protection
        if: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
        run: exit 1

  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # No-base release verification checks local archives; only the PR step below queries npm.
      - name: Check docs, types, behavior, examples, and isolated package consumers
        run: npm run verify:release
      - name: Dry-run changed packages
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && matrix.node == 24 }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run release:dry-run -- --base-ref "$BASE_SHA"
