# One-time, feature-branch-only migration. Removed after generated source/lock verification.
name: Prepare Meshy independent release
on:
  push:
    branches: [feat/meshy-provider]
    paths: [.github/workflows/prepare-meshy-release.yml]
permissions:
  contents: read
concurrency:
  group: prepare-meshy-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/meshy-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply reviewed independent-version migration
        run: node scripts/prepare-meshy-version-policy.mjs
      - name: Regenerate the lockfile using npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify selected versions and release-policy regressions
        run: |
          node scripts/check-release-version.mjs 4479f138c69ac83a747a8f37d76019ddea8bd961
          node --test tests/release.test.mjs tests/version-policy.test.mjs tests/meshy-release-policy.test.mjs
          git diff --check
      - name: Commit generated changes only to the existing feature branch
        run: |
          test "$GITHUB_REF" = refs/heads/feat/meshy-provider
          test "$(git ls-remote origin refs/heads/feat/meshy-provider | cut -f1)" = "$GITHUB_SHA"
          git add scripts/release.mjs scripts/smoke-packages.mjs scripts/version-policy.mjs scripts/publish.mjs tests/release.test.mjs tests/version-policy.test.mjs packages/provider/package.json packages/provider-utils/package.json packages/core/package.json packages/meshy/package.json packages/core/src/internal/runtime.ts tests/integration.test.mjs package-lock.json README.md docs/PUBLISHING.md docs/MESHY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): version Meshy changes independently and preserve existing dependency pins'
          git push origin HEAD:refs/heads/feat/meshy-provider
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)"
      - name: Verify installed package behavior without publishing
        run: |
          npm ci
          npm run verify:release
